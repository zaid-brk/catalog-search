name: Build and verify
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: [none, address]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-all-dev libgtest-dev
      - run: python -m pip install -e '.[dev]' pyarrow
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCATALOG_ASAN=${{ matrix.sanitizer == 'address' && 'ON' || 'OFF' }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: npm ci --prefix web && npm run build --prefix web
      - run: python -m catalog_search.prepare --source fixture --output data/fixture
      - run: build/catalog build --input data/fixture/catalog.jsonl --output data/fixture/catalog.csidx --clusters 16
      - run: python -m unittest discover -s python/tests -v
      - run: python scripts/smoke_http.py
      - run: python -m catalog_search.prepare --source synthetic --output data/ci-synthetic --limit 2000
      - run: build/catalog build --input data/ci-synthetic/catalog.jsonl --output data/ci-synthetic/catalog.csidx --clusters 16
      - run: python -m catalog_search.evaluate --dataset data/ci-synthetic --index data/ci-synthetic/catalog.csidx --output benchmarks/runs/ci --queries 5 --repeats 1 --probes 1 4 16
